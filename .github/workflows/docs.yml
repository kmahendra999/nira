name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/nira/**"
      - "website/public/**"
      - "scripts/install/install.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/nira/**"
      - "website/public/**"
      - "scripts/install/install.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --extra docs

      # Inject the public Supabase anon key so the savings leaderboard works on
      # the published docs site. Missing/empty (e.g. fork PRs) leaves the
      # leaderboard gracefully disabled. The key is read from env (not inlined)
      # and JSON-encoded into a JS string literal to avoid any injection.
      - name: Inject leaderboard Supabase anon key
        env:
          NIRA_LEADERBOARD_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          key = os.environ.get("NIRA_LEADERBOARD_ANON", "")
          pathlib.Path("docs/javascripts/leaderboard-config.js").write_text(
              "// Generated at docs-build time from the VITE_SUPABASE_ANON_KEY secret.\n"
              "window.NIRA_SUPABASE_ANON_KEY = " + json.dumps(key) + ";\n",
              encoding="utf-8",
          )
          print("leaderboard anon key:", "set" if key else "empty (leaderboard disabled)")
          PY

      - name: Build documentation
        run: uv run mkdocs build

      # One Pages site, two things on it: the front page at the root and the
      # documentation under /docs/. mkdocs owns `site/`, so the two are
      # assembled here rather than by pointing mkdocs at the front page.
      - name: Assemble the published site
        run: |
          set -eu
          rm -rf _site && mkdir -p _site
          cp -r website/public/. _site/

          # The installer is served from the site, so the command on the page
          # works. It is copied from the one place it lives.
          cp scripts/install/install.sh _site/install.sh

          # GitHub Pages runs Jekyll unless told not to, and Jekyll drops
          # files and directories whose names start with an underscore.
          touch _site/.nojekyll

          # _headers is Cloudflare/Netlify syntax and does nothing here.
          # Pages cannot send custom headers at all; the page carries a
          # meta CSP instead. Shipping a file that looks like a security
          # policy but is inert is worse than not shipping one.
          rm -f _site/_headers

          # The apk is not in the repository, and should not be: it is 42 MiB
          # of build output. It is published as a release asset, which has no
          # size or bandwidth limit and does not count against the repo.
          rm -rf _site/downloads
          printf '{\n  "downloadsBase": "https://github.com/${{ github.repository }}/releases/latest/download"\n}\n' \
            > _site/config.json

          mkdir -p _site/docs
          cp -r site/. _site/docs/

          echo "assembled:"; find _site -maxdepth 2 -not -path '*/docs/*' | sort | sed 's/^/  /'

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
