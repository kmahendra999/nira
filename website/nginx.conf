# Nira site — nginx.
#
# Static files and one large download. Deliberately small: there is no
# application here, so anything that would need a runtime does not belong.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The APK is 44 MB. sendfile with a large chunk keeps that off the
    # worker's heap; gzip on an already-compressed archive only burns CPU.
    sendfile           on;
    tcp_nopush         on;
    sendfile_max_chunk 512k;

    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml application/json;
    gzip_min_length   1024;

    # data: is permitted for images because the theme draws its grain
    # and its chevrons as inline SVG, and is withheld from default-src,
    # where it would also permit data: scripts.
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header X-Frame-Options         "DENY"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # Nothing off-origin: the font is served from here, so no third party
    # needs to be permitted, and 'unsafe-inline' is kept only for style
    # attributes. The page loads no external resource of any kind.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # No single-page fallback. This is one document, not a router, and
    # serving it for every unknown path would answer 200 to requests for
    # files that are not here — including the HEAD the download page uses
    # to decide whether a build exists.
    location / {
        try_files $uri $uri/ =404;
    }

    # Downloads are served as attachments and never cached: the whole point
    # is that a rebuilt apk is picked up without anyone clearing a cache.
    # The manifest lives beside the downloads but is not one: it should
    # be read by the page, not saved by the browser, and the `types` block
    # below replaces the whole MIME map for that prefix, so json would
    # otherwise be served as an octet-stream attachment.
    location = /downloads/checksums.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control       "no-store"   always;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }

    # "no-cache" means revalidate before use, not "do not store". With
    # ETags that costs a 304 and guarantees a rebuilt container is what
    # the reader sees. An hour of hard caching is the right trade on the
    # public internet and the wrong one here: this image is meant to be
    # rebuilt and restarted, and a stale asset would make it look as
    # though the rebuild had not worked.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }
}
