# The site's security headers.
#
# This exists as a snippet because of how `add_header` works: nginx inherits
# these from an outer level "if and only if there are no add_header directives
# defined on the current level". Every location in nira.conf sets a
# Cache-Control, a Content-Disposition or a default_type with its own
# add_header -- so every one of them silently dropped the whole server-level
# set, and the site served no CSP, no X-Frame-Options, no nosniff and no
# Referrer-Policy on any URL a reader could actually reach. Only a path that
# fell through to the bare `location /` kept them.
#
# There is no "append" form in stock nginx, so the only fix is to repeat the
# set wherever a location adds a header of its own. Repeating an include is
# cheaper to keep right than repeating four directives.

add_header X-Content-Type-Options  "nosniff"                         always;
add_header X-Frame-Options         "DENY"                            always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
# data: is permitted for images because the theme draws its grain and its
# chevrons as inline SVG, and is withheld from default-src, where it would
# also permit data: scripts. Nothing off-origin: the font is served from here,
# so no third party needs to be permitted, and 'unsafe-inline' is kept only
# for style attributes.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
